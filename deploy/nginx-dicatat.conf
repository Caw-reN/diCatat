server {
    listen 8080;
    server_name _;

    # Root untuk Frontend React (hasil npm run build)
    root /var/www/dicatat/app-react/dist;
    index index.html;

    client_max_body_size 20M;

    # 1. Route API & Storage Uploads diteruskan ke Laravel PHP-FPM
    location ~ ^/(api|storage|sanctum|up) {
        root /var/www/dicatat/backend-laravel/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/dicatat/backend-laravel/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 2. Route Frontend React (termasuk /, /admin, /auth/google/callback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}


server {
    listen 8080;
    server_name _;

    root /var/www/dicatat/app-react/dist;
    index index.html;

    client_max_body_size 20M;

    # 1. API Laravel & Storage Foto Struk
    location ~ ^/(api|storage|sanctum|up) {
        root /var/www/dicatat/backend-laravel/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/dicatat/backend-laravel/public;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 2. Frontend React SPA (/, /admin, /auth/google/callback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
